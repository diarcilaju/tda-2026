<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rutas de Lambayeque</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #202b2b; background: #f3f6f4; }
        body { max-width: 760px; margin: 40px auto; padding: 0 20px; }
        h1 { margin-bottom: 6px; color: #176b56; }
        .subtitulo { margin-top: 0; color: #52625e; }
        section { margin-top: 24px; padding-top: 18px; border-top: 1px solid #ccd8d2; }
        .controles { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; }
        label { display: grid; gap: 6px; font-weight: 600; }
        select, button { min-height: 40px; padding: 8px 12px; font: inherit; }
        select { min-width: 170px; border: 1px solid #9aaca4; border-radius: 4px; background: white; }
        button { border: 0; border-radius: 4px; background: #176b56; color: white; cursor: pointer; }
        button:hover { background: #105341; }
        #resultado { min-height: 1.5em; font-weight: 600; }
        ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 24px; padding-left: 20px; }
        li { color: #394b46; }
        @media (max-width: 480px) { body { margin-top: 24px; } .controles { align-items: stretch; flex-direction: column; } select, button { width: 100%; } }
    </style>
</head>
<body>
    <main>
        <h1>Rutas de Lambayeque</h1>
        <p class="subtitulo">Calcula el recorrido de menor distancia entre ciudades.</p>

        <section aria-labelledby="titulo-calculo">
            <h2 id="titulo-calculo">Calcular ruta</h2>
            <div class="controles">
                <label>Origen <select id="origen"></select></label>
                <label>Destino <select id="destino"></select></label>
                <button id="calcular" type="button">Calcular ruta</button>
            </div>
            <p id="resultado" aria-live="polite">Selecciona origen y destino.</p>
        </section>

        <section aria-labelledby="titulo-conexiones">
            <h2 id="titulo-conexiones">Conexiones del mapa</h2>
            <ul id="conexiones"></ul>
        </section>
    </main>
    <script type="module" src="./app.js"></script>
</body>
</html>
